version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*", "codemirror"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
