name: Release

# Push a tag like v0.6.0 (matching package.json) to build the macOS, Windows
# and Linux packages, check each one starts (see packages.yml) and attach them
# to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.5.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ env.TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"

  packages:
    needs: check
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ needs.check.outputs.tag }}

  release:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          - **macOS**: `-arm64.dmg` (Apple Silicon) or `-x64.dmg` (Intel). The app isn't notarized: use *System Settings → Privacy & Security → Open Anyway*, or run `xattr -dr com.apple.quarantine /Applications/Graphite.app`.
          - **Windows** (x64, Windows 10 or 11): `Graphite-Setup-*.exe` installs for your user, no admin needed; or unzip the portable `-win-x64.zip`. The installer isn't code-signed yet: if SmartScreen stops it, click *More info → Run anyway*.
          - **Debian / Ubuntu**: `sudo apt install ./graphite_*_amd64.deb`
          - **Fedora / RHEL / Rocky / Alma / CentOS Stream**: `sudo dnf install ./graphite-*.x86_64.rpm`
          - **Arch / Manjaro / EndeavourOS**: `sudo pacman -U ./graphite-*-x86_64.pacman`
          - **Any Linux**: the portable `.AppImage`.
          NOTES
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Graphite ${TAG#v}" --notes-file notes.md
          gh release upload "$TAG" packages/* --clobber
