name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build renderer
        run: npm run build
      - name: Check translations
        run: npm run i18n:check
      - name: Syntax-check main and utility process code
        run: find electron shared -name '*.cjs' -o -name '*.mjs' | xargs -n1 node --check
